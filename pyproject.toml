[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "underline-retldc"
version = "0.1.0"
description = "Offline rocket-engine test log decoding and computation platform"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "PySide6>=6.8",
    "pyqtgraph>=0.13.7",
    "scipy>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[project.scripts]
underline-retldc = "underline_retldc.app.application:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
underline_retldc = ["i18n/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

